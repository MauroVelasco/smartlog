services:
  postgres:
    image: postgres:16
    container_name: log_intelligence_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_intelligence
      TZ: UTC
    # Logging flags for the scenario harness (postgres-scenario-harness):
    # logging_collector writes a readable server logfile (pg_current_logfile()),
    # log_line_prefix gives PostgresLogFileExtractor's _PG_ENTRY_START a
    # parseable "%m [%p] " prefix, log_min_messages=info surfaces RAISE
    # INFO/NOTICE, and terse/panic suppress the CONTEXT:/STATEMENT: phantom
    # log lines that harness.emit_log()'s caught RAISE EXCEPTION would
    # otherwise also write (see design Decision on emit_log gotchas).
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - "log_line_prefix=%m [%p] "
      - -c
      - log_min_messages=info
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
    ports:
      - "5432:5432"
    volumes:
      - log_intelligence_data:/var/lib/postgresql/data

  tomcat:
    image: tomcat:10.1-jdk17-corretto
    container_name: tomcat_app
    restart: unless-stopped
    # The base image's default CMD ("catalina.sh run") does not produce a
    # catalina.out file — it only writes date-rotated catalina.<date>.log
    # and sends stdout to `docker logs`. Redirect explicitly so a real
    # catalina.out exists for TOMCAT_LOG_PATHS to read. "$$" escapes the
    # variable so compose passes it through literally instead of resolving
    # it against the host environment.
    command: ["/bin/sh", "-c", "exec catalina.sh run >> \"$$CATALINA_HOME/logs/catalina.out\" 2>&1"]
    ports:
      - "8080:8080"
    environment:
      - JPDA_ADDRESS=*:8000
      - JPDA_TRANSPORT=dt_socket
      # -Duser.timezone=UTC + TZ=UTC keep Tomcat's juli timestamps (which
      # carry no explicit offset, per _normalize_tomcat's assumption)
      # aligned with Postgres's %m-prefixed, real-offset timestamps — a
      # clock skew here would silently corrupt the 300s/120s correlation
      # windows across sources (postgres-scenario-harness design).
      - CATALINA_OPTS=-Xms512m -Xmx1024m -Duser.timezone=UTC
      - TZ=UTC
    volumes:
      # Mount webapps directory to persist deployed WAR files
      - ./webapps:/usr/local/tomcat/webapps
      # Mount logs directory to access Tomcat logs on host
      - ./logs:/usr/local/tomcat/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  log_intelligence_data:
