# =============================================================================
# cloudwatch-log-generator - configuration
#
# Every value below is overridable via an environment variable (see README.md
# for the exact ECS task definition entries). Nothing here needs to change
# between environments - all environment-specific values are meant to come
# from the ECS task definition's `environment` / `secrets` blocks.
# =============================================================================

# -----------------------------------------------------------------------------
# Correlation control - the three required behaviors:
#   generateCorrelatedLogs=true  -> every log event reuses trxId/username/componentId
#   generateCorrelatedLogs=false -> a fresh random value is generated per event
#
# These three property names are exact matches for their environment variable
# names (generateCorrelatedLogs / trxId / username / componentId): MicroProfile
# Config tries an exact env-var-name lookup before falling back to the usual
# upper-snake-case conversion, so they can be set in ECS literally as-is.
# -----------------------------------------------------------------------------
generateCorrelatedLogs=${GENERATED_CORRELATED_LOGS:false}

# Only read when generateCorrelatedLogs=true. Leave unset in ECS to let the
# app pick one random value at startup and reuse it for the life of the task
# (see CorrelationConfig) instead of failing.
trxId=${TRX_ID:"5e62191f-a874-423e-a1d1-5b1bc2c7e305"}
username=${USERNAME:"jsmith"}
componentId=${COMPONENT_ID:"shipping-service"}

# -----------------------------------------------------------------------------
# Log generation cadence / shape
# -----------------------------------------------------------------------------
# How often a batch is generated. Accepts Quarkus duration shorthand (e.g.
# "500ms", "5s", "1m"). Env var: LOG_GENERATOR_INTERVAL
log.generator.interval=5s

# How many log lines to emit per interval tick. Env var: LOG_GENERATOR_BATCH_SIZE
log.generator.batch-size=1

# Value stamped into the "applicationName" MDC field of every event, and used
# as the ECS/CloudWatch-facing identity of this task if you run several
# instances of this image with different roles. Env var: LOG_GENERATOR_APPLICATION_NAME
log.generator.application-name=cloudwatch-log-generator

# When true (default), every log message also carries trace_id/request_id/
# user_id/service_name[/error_code] tokens - the identifier names the
# companion log_correlation_poc project's extractor already recognizes via
# regex - so this generator's CloudWatch output can be used directly as test
# input for that pipeline. Set to false for a leaner message if you don't
# need that compatibility. Env var: LOG_GENERATOR_EMIT_CORRELATION_ALIASES
log.generator.emit-correlation-aliases=true

# -----------------------------------------------------------------------------
# JSON logging on stdout -> Docker awslogs driver -> CloudWatch Logs.
# This app never calls the CloudWatch API directly; ECS's log driver is what
# ships these lines, per the task definition's logConfiguration (see
# ecs/task-definition.json).
# -----------------------------------------------------------------------------
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.determine-print-stack-trace-by-throwable=true
quarkus.log.console.json.exception-output-type=formatted

quarkus.log.level=INFO
# The generator deliberately produces some DEBUG-level events too (see
# RandomLogValues#randomLevel); this override keeps them from being filtered
# out before they ever reach stdout.
quarkus.log.category."cloudwatch-log-generator".level=DEBUG

# No ASCII banner - keep the CloudWatch stream clean.
quarkus.banner.enabled=false

# -----------------------------------------------------------------------------
# HTTP - used only for the /q/health endpoints the ECS container health check
# and/or an ALB target group can hit.
# -----------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
